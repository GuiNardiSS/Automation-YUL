name: Poll PNCP for audiovisual tenders

on:
  # Triggered externally by a cron-job.org job calling the GitHub REST API
  # (POST .../actions/workflows/<id>/dispatches, body {"ref":"master"}) at
  # 08:17, 10:17, 12:17, 14:17 and 16:17 America/Sao_Paulo. GitHub's own
  # `schedule:` trigger was dropped because it silently skipped most runs
  # (none fired at all on 2026-09-25). A run takes ~8 min (every UF x
  # modality queried, paced for PNCP's rate limit), so five runs a day keeps
  # usage inside the private-repo free tier; each run looks back a full day,
  # so tenders published after the last run are picked up next morning.
  # isWithinBusinessHours() in src/index.ts skips runs dispatched off-hours.
  workflow_dispatch: {}

concurrency:
  group: poll-cycle
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # Backstop for anything not already individually bounded (Redis/PNCP/SMTP
    # each have their own short timeouts — see their docs.md files) such as a
    # stuck npm ci/build. Without this, a genuine hang falls back to GitHub's
    # 360-minute default, which would exhaust the free-tier minutes budget.
    # A normal run is ~8 min; the slack covers PNCP rate-limit backoffs.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm start
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
