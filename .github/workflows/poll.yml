name: Poll PNCP for audiovisual tenders

on:
  schedule:
    # Every 2 hours at :17 — 11,13,15,17,19 UTC == 08:17-16:17 America/Sao_Paulo
    # (fixed UTC-3 year-round since Brazil abolished DST in 2019). A run takes
    # ~8 min (every UF x modality queried, paced for PNCP's rate limit), so
    # this keeps usage inside the private-repo free tier. Tenders published
    # after the last run are picked up next morning: each run looks back a
    # full day. Minute 17 avoids GitHub's top-of-hour scheduling congestion.
    # isWithinBusinessHours() in src/index.ts guards against late-firing runs.
    - cron: '17 11-19/2 * * *'
  workflow_dispatch: {}

concurrency:
  group: poll-cycle
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # Backstop for anything not already individually bounded (Redis/PNCP/SMTP
    # each have their own short timeouts — see their docs.md files) such as a
    # stuck npm ci/build. Without this, a genuine hang falls back to GitHub's
    # 360-minute default, which would exhaust the free-tier minutes budget.
    # A normal run is ~8 min; the slack covers PNCP rate-limit backoffs.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm start
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
